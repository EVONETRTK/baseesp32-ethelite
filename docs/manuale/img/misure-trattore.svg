  <circle cx="170" cy="233.7" r="1.5" fill="#3b4148"/>
  <circle cx="177.3" cy="236.7" r="1.5" fill="#3b4148"/>
  <circle cx="170" cy="244" r="5.7" fill="#4a5058"/>
