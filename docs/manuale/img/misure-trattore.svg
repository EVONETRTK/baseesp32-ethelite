  <ellipse cx="262" cy="157" rx="10" ry="3.5" fill="none" stroke="#22262b" stroke-width="2.5" transform="rotate(-25 262 157)"/>
  <!-- telaio della cabina: montante posteriore curvo, montante della porta,
