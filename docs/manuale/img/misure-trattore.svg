  <!-- parafango posteriore ampio, avvolge la ruota fin dietro -->
  <path d="M246 208.5 A84 84 0 0 0 93.9 208.5 L104.7 213.6 A72 72 0 0 1 235.3 213.6 Z" fill="url(#mt-corpo)" stroke="#124a2c" stroke-width="1.5"/>
  <path d="M93.9 208.5 L104.7 213.6 L104 232 L92 232 Z" fill="#2b3036"/>
  <rect x="98" y="196" width="10" height="5" rx="2" fill="#e04848" transform="rotate(-62 103 198)"/>

  <!-- ruota anteriore -->
  <!--RUOTA:ant:369:264:47:24-->
  <circle cx="383.1" cy="264" r="47" fill="#111111"/>
  <circle cx="369" cy="264" r="47" fill="#202020"/>
