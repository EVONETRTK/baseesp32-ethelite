  <rect x="164" y="100" width="13" height="4" rx="2" fill="#ffffff"/><rect x="279" y="100" width="13" height="4" rx="2" fill="#ffffff"/>
  <path d="M166 106 H286 C287 140 288 176 289 210 H172 C165 188 160 164 160 142 C160 126 162 114 166 106 Z" fill="url(#mt-vetro)"/>
  <path d="M240 112 L274 112 L252 172 L240 172 Z" fill="#fff" opacity=".35"/>
  <path d="M180 116 L196 116 L186 150 L178 150 Z" fill="#fff" opacity=".25"/>
  <!-- interni -->
