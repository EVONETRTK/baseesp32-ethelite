  <path d="M233 77 H540" stroke="#1f5fa8" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M532 79 V308" stroke="#1f5fa8" stroke-width="2" marker-start="url(#mt-f)" marker-end="url(#mt-f)"/>
  <rect x="521" y="184" width="22" height="20" rx="4" fill="#f8fafc"/>
  <text x="532" y="199" fill="#1f5fa8" font-weight="800" text-anchor="middle" font-size="15">A</text>
  <!-- quota B -->
  <path d="M170 48 V176" stroke="#1f5fa8" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M230 48 V58" stroke="#1f5fa8" stroke-width="1" stroke-dasharray="3 2"/>
  <path d="M172 42 H228" stroke="#1f5fa8" stroke-width="2" marker-start="url(#mt-f)" marker-end="url(#mt-f)"/>
