<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <!-- Disegno EVONETRTK: trattore moderno generico, senza marchi. Sagoma e
       proporzioni ricavate da un disegno tecnico di riferimento, ribaltato e
       portato in scala (ruota posteriore r 66 px). Vista di lato circa 70 px/m,
       vista dall'alto circa 52 px/m. Ruote generate da strumenti/ruote.js.
       A altezza dell'antenna, B distanza dall'asse posteriore, C spostamento
       laterale, D passo. -->
  <defs>
    <marker id="mt-f" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f5fa8"/></marker>
    <linearGradient id="mt-corpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a9a60"/><stop offset=".45" stop-color="#23774a"/><stop offset="1" stop-color="#175535"/>
    </linearGradient>
    <linearGradient id="mt-vetro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf5fc"/><stop offset=".55" stop-color="#b9d8ec"/><stop offset="1" stop-color="#8fb9d8"/>
    </linearGradient>
    <linearGradient id="mt-scuro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d434a"/><stop offset="1" stop-color="#22262b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="#f8fafc"/>
  <text x="20" y="26" font-weight="700" fill="#164f2e" font-size="14">Vista di lato</text>
  <text x="575" y="26" font-weight="700" fill="#164f2e" font-size="14">Vista dall'alto</text>

  <!-- ======================= VISTA DI LATO (avanti a destra) ======================= -->
  <rect x="0" y="310" width="560" height="6" fill="#8a7a5a"/>

  <!-- sollevatore posteriore -->
  <g stroke="#2b3036" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M104 238 L84 252"/><path d="M106 224 L86 232"/><path d="M84 252 L86 232"/>
  </g>
  <circle cx="84" cy="252" r="4" fill="#2b3036"/><circle cx="86" cy="232" r="4" fill="#2b3036"/>

  <!-- telaio e motore tra le ruote -->
  <path d="M200 220 H414 V242 Q414 248 408 248 H200 Z" fill="url(#mt-scuro)"/>

  <!-- zavorre e supporto anteriore -->
  <path d="M410 228 H446 Q456 228 456 238 V250 Q456 258 446 258 H410 Z" fill="url(#mt-scuro)"/>
  <path d="M420 234 V254 M430 234 V254 M440 234 V254" stroke="#4a5058" stroke-width="1.5"/>
  <path d="M456 246 H464 V252 H456" fill="none" stroke="#2b3036" stroke-width="3"/>

  <!-- cofano corto con muso tondo -->
  <path d="M282 160 C316 160 352 166 378 176 C396 184 408 194 411 208 L411 222 Q410 228 403 228 H282 Z" fill="url(#mt-corpo)" stroke="#124a2c" stroke-width="2"/>
  <path d="M290 178 C322 178 356 184 384 196" fill="none" stroke="#56b37b" stroke-width="2" opacity=".8"/>
  <!-- presa d'aria e faro -->
  <path d="M318 188 C336 189 352 192 366 197 L366 206 C352 202 336 199 318 199 Z" fill="#22262b"/>
  <path d="M378 182 C392 187 402 194 407 202 L392 203 Z" fill="#ffffff" stroke="#8aa0b0" stroke-width=".8"/>
  <path d="M404 210 Q410 214 410 220 V226 H402 Z" fill="#22262b"/>

  <!-- cabina come nel riferimento: tetto bombato che sporge davanti e dietro,
       parabrezza quasi verticale, lunotto posteriore curvo che sporge sopra
       il parafango, montante della porta inclinato con la maniglia -->
  <path d="M152 99 C152 91 160 87 176 85.5 C212 82.5 256 82.5 286 85.5 C298 87 304 91 304 99 V104 Q304 106 300 106 H156 Q152 106 152 104 Z" fill="url(#mt-corpo)" stroke="#124a2c" stroke-width="2"/>
