  <g fill="none" stroke="#22262b" stroke-linecap="round">
    <path d="M166 106 C162 114 160 126 160 142 C160 164 165 188 172 210" stroke-width="5"/>
    <path d="M286 106 C287 140 288 176 289 210" stroke-width="5"/>
    <path d="M222 106 C220 140 222 176 228 210" stroke-width="4"/>
    <path d="M228 196 H287" stroke-width="2.5"/>
  </g>
  <rect x="230" y="160" width="10" height="3.5" rx="1.5" fill="#9aa3ac"/>
  <!-- specchio e luci di lavoro -->
  <path d="M286 114 L308 106" stroke="#22262b" stroke-width="3"/>
  <rect x="306" y="94" width="8" height="22" rx="3" fill="#22262b"/>
  <rect x="294" y="106" width="8" height="5" rx="1.5" fill="#22262b"/>
  <!-- pavimento cabina -->
  <rect x="162" y="206" width="130" height="10" rx="4" fill="#124a2c"/>

  <!-- scaletta di accesso -->
  <path d="M258 214 V276 M282 214 V276" stroke="#2b3036" stroke-width="3"/>
  <g fill="#3a4047"><rect x="256" y="226" width="28" height="4" rx="1.5"/><rect x="256" y="243" width="28" height="4" rx="1.5"/><rect x="256" y="260" width="28" height="4" rx="1.5"/><rect x="256" y="274" width="28" height="4" rx="1.5"/></g>

