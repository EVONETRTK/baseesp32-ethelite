<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 34 232 184" role="img" aria-label="EVONETRTK">
  <!-- Logo PROVVISORIO EVONETRTK: robottino alla guida di un trattore moderno
       (stessa sagoma del disegno delle misure) nei campi, con un satellite che
       invia le onde radio all'antenna. Personaggio originale (non il robot
       Android). Ruote generate da strumenti/ruote.js. Per cambiare logo basta
       sostituire questo file e rigenerare il manuale. -->
  <defs>
    <linearGradient id="lg-cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3f7"/><stop offset=".7" stop-color="#e6f5ff"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="lg-campo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86c997"/><stop offset="1" stop-color="#2f7d4b"/>
    </linearGradient>
    <linearGradient id="lg-corpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a9a60"/><stop offset=".45" stop-color="#23774a"/><stop offset="1" stop-color="#175535"/>
    </linearGradient>
    <linearGradient id="lg-vetro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f8fd"/><stop offset="1" stop-color="#9cc3e0"/>
    </linearGradient>
    <linearGradient id="lg-scuro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d434a"/><stop offset="1" stop-color="#22262b"/>
    </linearGradient>
    <linearGradient id="lg-anello" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f6b3f"/><stop offset="1" stop-color="#123f25"/>
    </linearGradient>
    <radialGradient id="lg-testa" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfd8e0"/>
    </radialGradient>
  </defs>

  <g>
