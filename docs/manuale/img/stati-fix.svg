<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <!-- Disegno originale EVONETRTK: dalla posizione autonoma all'RTK fisso -->
  <defs>
    <marker id="sf-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#556070"/></marker>
  </defs>
  <rect width="720" height="220" fill="#f8fafc"/>

  <!-- quattro stati: cerchio dell'incertezza sempre piu' piccolo -->
  <g text-anchor="middle">
    <!-- nessun fix -->
    <circle cx="90" cy="92" r="58" fill="#f3f4f6" stroke="#9aa1a8" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="90" y="97" font-size="26" fill="#9aa1a8">?</text>
    <text x="90" y="174" font-weight="700" fill="#556070">Nessun fix</text>
    <text x="90" y="192" fill="#556070">nessuna posizione</text>

    <!-- GPS autonomo -->
    <circle cx="270" cy="92" r="52" fill="#fdecec" stroke="#c4161c" stroke-width="2"/>
    <circle cx="270" cy="92" r="4" fill="#1a1a1a"/>
    <text x="270" y="174" font-weight="700" fill="#b91c1c">GPS (autonomo)</text>
    <text x="270" y="192" fill="#556070">1–5 m</text>

    <!-- float -->
    <circle cx="450" cy="92" r="22" fill="#fdf3e2" stroke="#b45309" stroke-width="2"/>
    <circle cx="450" cy="92" r="4" fill="#1a1a1a"/>
    <text x="450" y="174" font-weight="700" fill="#b45309">RTK float</text>
    <text x="450" y="192" fill="#556070">da 10 cm a mezzo metro</text>

    <!-- fix -->
    <circle cx="630" cy="92" r="7" fill="#e4f4ea" stroke="#15803d" stroke-width="2"/>
    <circle cx="630" cy="92" r="3" fill="#1a1a1a"/>
    <text x="630" y="174" font-weight="700" fill="#15803d">RTK fisso</text>
    <text x="630" y="192" fill="#556070">1–2 cm</text>
  </g>

  <!-- frecce con le condizioni -->
  <path d="M152 92 H212" stroke="#556070" stroke-width="2" marker-end="url(#sf-f)"/>
  <path d="M326 92 H422" stroke="#556070" stroke-width="2" marker-end="url(#sf-f)"/>
  <path d="M476 92 H617" stroke="#556070" stroke-width="2" marker-end="url(#sf-f)"/>
  <g font-size="11.5" fill="#334" text-anchor="middle">
    <text x="182" y="80">satelliti</text>
    <text x="374" y="80">correzioni in arrivo</text>
    <text x="546" y="80">calcolo risolto</text>
    <text x="546" y="112">di solito &lt; 1 minuto</text>
  </g>
  <text x="360" y="20" text-anchor="middle" fill="#556070" font-size="12">il cerchio indica l'incertezza della posizione (non in scala)</text>
</svg>
